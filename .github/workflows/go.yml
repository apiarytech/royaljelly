name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  # Fail instead of silently downloading a newer toolchain, so each matrix
  # entry really tests the Go version it names.
  GOTOOLCHAIN: local

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        go:
          - '1.26' # Minimum version. Keep in sync with the go directive in go.mod.
          - 'stable'
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go }}

    - name: Build
      run: go build -v ./...

    - name: Vet
      run: go vet ./...

    - name: Test
      run: go test -v ./...

  lint-race:
    name: Format, race detector and benchmarks
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 'stable'

    - name: Check formatting
      run: |
        unformatted=$(gofmt -l .)
        if [ -n "$unformatted" ]; then
          echo "These files need gofmt:"
          echo "$unformatted"
          exit 1
        fi

    - name: Test with race detector
      run: go test -race -count=1 ./...

    - name: Benchmark smoke test
      run: go test -run XXX -bench . -benchtime 200x ./core

  tinygo-test:
    name: TinyGo Build Test
    runs-on: ubuntu-latest
    env:
      # TinyGo selects its own Go toolchain.
      GOTOOLCHAIN: auto
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable' # TinyGo needs a Go installation

      - name: Set up TinyGo
        uses: acifani/setup-tinygo@v3
        with:
          tinygo-version: '0.41.1' # Specify the TinyGo version you want to use

      - name: Test with TinyGo
        run: tinygo test -v ./...
